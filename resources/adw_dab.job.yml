# The main job for wwi_dab.
resources:
  jobs:
    adw_dab_job:
      name: adw_dab_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - carlosmag.barreto@gmail.com

      tasks:
        - task_key: extraction_adw
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../src/adw_dab/extraction_adw.ipynb

        - task_key: refresh_pipeline
          depends_on:
            - task_key: extraction_adw
          pipeline_task:
            pipeline_id: ${resources.pipelines.adw_dab_pipeline.id}

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 16.2.x-scala2.12
            node_type_id: Standard_DS3_v2
            autoscale:
                min_workers: 1
                max_workers: 1
